"$id": "https://schema.jupytergis.org/events/document/v1"
version: "1"
title: "JupyterGIS Document Event"
description: "A JupyterGIS document was opened or closed (either as standalone or in a widget) in the GUI."
type: "object"
required:
  - "verb"
  - "object"
properties:
  subject:
    title: "Subject"
    description: "The performer of `verb`. Client ID of acting user, if available."
    type: "string"
  verb:
    title: "Verb"
    description: "Document lifecycle action"
    enum:
      - "opened"
      - "closed"
  object:
    title: "Object"
    description: "The thing that `verb` was performed on."
    type: "object"
    required:
      - "document_path"
    properties:
      document_path:
        title: "Document path"
        description: "The path of the `.jGIS` document, or `null` if ephemeral."
        type: ["string", "null"]
